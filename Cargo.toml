[package]
name = "fieldchain"
version = "0.4.6"
edition = "2021"
description = "A lightweight, append-only cryptographic chain for ODK submissions"
license = "MIT OR Apache-2.0"
keywords = ["odk", "field", "chain", "cryptographic", "append-only"]

[dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util", "signal"] }
sqlx = { version = "0.7", features = ["runtime-tokio", "sqlite"] }
sha2 = "0.10"
walkdir = "2"
notify = "6"
zip = { version = "0.6", default-features = false, features = ["deflate"] }
chrono = "0.4"
tracing = "0.1"
tracing-subscriber = "0.3"
hex = "0.4"
dirs = "5.0"
async-trait = "0.1"
quick-xml = "0.30"
rand = "0.8"  # for salt generation

[features]
default = []
saf-sim = []
extra-tracing = []

[profile.release]
lto = true
codegen-units = 1
strip = true

